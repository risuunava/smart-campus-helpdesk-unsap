version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: unsap_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - /app/vendor
    environment:
      - APP_ENV=local

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: unsap_frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    depends_on:
      - backend
      - ml-service

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile.dev
    container_name: unsap_ml_service
    ports:
      - "5000:5000"
    volumes:
      - ./ml-service:/app
